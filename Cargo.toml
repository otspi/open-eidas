[workspace]
resolver = "2"
members = [
    "crates/oe-config",
    "crates/oe-certs",
    "crates/oe-hsm",
    "crates/oe-timesource",
    "crates/oe-audit",
    "crates/oe-conformance",
    "crates/oe-rfc3161-asn1",
    "crates/oe-tsa-core",
    "crates/oe-crosstsa",
    "crates/oe-replicate",
    "crates/oe-s3",
    "crates/oe-enroll",
    "crates/oe-httpapi",
    "crates/oe-ocsp-core",
    "crates/oe-castore",
    "crates/oe-ca-core",
    "crates/oe-raflow",
    "crates/oe-webauthn",
    "crates/oe-actions",
    "bin/tsa-server",
    "bin/ocsp-responder",
    "bin/ca-server",
    "bin/ra-console",
]

[workspace.package]
edition = "2021"
rust-version = "1.97"
license = "EUPL-1.2 OR AGPL-3.0-only"
repository = "https://github.com/open-eidas/open-eidas"

[workspace.lints.rust]
unsafe_code = "forbid"

# Les tests génèrent des bi-clés RSA (jusqu'à 4096 bits) avec la crate `rsa` :
# sans optimisation, l'arithmétique de `num-bigint-dig` y passe l'essentiel du
# temps des suites (63 s contre 2 s pour oe-conformance/tests/tsu_certificate.rs).
# Ne concerne que les profils dev et test ; le profil release est inchangé.
[profile.dev.package.num-bigint-dig]
opt-level = 3
