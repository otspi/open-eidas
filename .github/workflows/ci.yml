name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Clippy, tests
    runs-on: ubuntu-latest
    # PostgreSQL réel pour les tests d'invariants du registre des opérateurs
    # (crates/oe-castore/tests/operators_schema.rs) : ces contraintes et ces
    # droits sont portés par la base, un test qui ne l'exécute pas ne prouve
    # rien.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # SoftHSM2 pour le test du binaire tsa-server (bin/tsa-server/tests/serve.rs),
      # que la matrice de conformité cite comme preuve de mise en service
      # (constat D-2) : OE_REQUIRE_SOFTHSM le fait échouer, plutôt que s'ignorer,
      # si SoftHSM venait à manquer.
      - name: Installe SoftHSM2
        run: sudo apt-get update && sudo apt-get install -y softhsm2

      # Une seule passe pour tout le workspace, suites PostgreSQL comprises
      # (gardées par OE_CASTORE_TEST_DSN) : schéma du registre, contraintes et
      # droits du rôle de ra-console (oe-castore), actions d'opérateur signées,
      # dont la preuve que la faille R2a est fermée (oe-actions, docs/WEBUI.md
      # §16), et amorçage du premier administrateur (oe-actions, ca-server).
      # Deux passes rejouaient deux fois les suites de ces paquets.
      #
      # Sans cette variable, ces tests s'ignorent EN RESTANT VERTS : un service
      # PostgreSQL absent, une variable perdue dans un refactoring de workflow, et
      # la CI ne prouverait plus rien sans le dire. Chaque test qui s'ignore écrit
      # « test PostgreSQL ignoré » ; on lit donc la sortie (`--nocapture`) et on
      # échoue si ce message y figure, ou si la base ne répond pas.
      - name: cargo test (workspace, PostgreSQL réel)
        run: |
          set -o pipefail
          test -n "$OE_CASTORE_TEST_DSN" || { echo "::error::OE_CASTORE_TEST_DSN n'est pas définie"; exit 1; }
          pg_isready -h localhost -p 5432 -U postgres || { echo "::error::PostgreSQL ne répond pas : les tests seraient ignorés"; exit 1; }
          cargo test --workspace --features oe-castore/postgres -- --nocapture 2>&1 | tee pg-tests.log
          if grep -q "test PostgreSQL ignoré" pg-tests.log; then
            echo "::error::des tests PostgreSQL se sont ignorés alors que la base est censée être disponible"
            grep -n "test PostgreSQL ignoré" pg-tests.log | head
            exit 1
          fi
        env:
          OE_REQUIRE_SOFTHSM: "1"
          OE_CASTORE_TEST_DSN: postgres://postgres:test@localhost:5432/postgres

      # Constat C-5 : `pkilint` relit la hiérarchie produite par la vraie
      # cérémonie PSS (racine, émettrice, ARL) — profil PKIX, seuil WARNING.
      # Pas de lint de chaîne : la version épinglée vérifie toute signature en
      # PKCS#1 v1.5 et rejette à tort une signature PSS, ce que openssl
      # (test pss_ceremony) contrôle déjà.
      - name: pkilint (hiérarchie PSS et certificats finaux)
        run: |
          set -euo pipefail
          pip install --user pkilint==0.13.3
          export PATH="$HOME/.local/bin:$PATH"
          rm -rf pki-export
          OE_PKI_EXPORT_DIR="$PWD/pki-export" cargo test -p ca-server --features oe-castore/postgres --test pss_ceremony
          test -s pki-export/pss-root.pem
          # Sortie JSON : aucune constatation de gravité WARNING ou plus.
          clean() {
            out=$("$@" -f JSON)
            echo "$*: $out"
            python3 -c 'import json, sys; sys.exit(1 if json.loads(sys.argv[1])["results"] else 0)' "$out"
          }
          clean lint_pkix_cert lint -s WARNING pki-export/pss-root.pem
          clean lint_pkix_cert lint -s WARNING pki-export/pss-issuing.pem
          clean lint_crl lint -t ARL -p PKIX -s WARNING pki-export/pss-arl.pem
          # Certificats d'entité finale (profils TSU et répondeur OCSP), tels que
          # le test du binaire tsa-server les fait émettre par la CA.
          OE_PKI_EXPORT_DIR="$PWD/pki-export" cargo test -p tsa-server --test serve
          clean lint_pkix_cert lint -s WARNING pki-export/ee-tsu.pem
          clean lint_pkix_cert lint -s WARNING pki-export/ee-ocsp.pem
        env:
          OE_REQUIRE_SOFTHSM: "1"
          OE_CASTORE_TEST_DSN: postgres://postgres:test@localhost:5432/postgres

      # RUSTSEC-2023-0071 (« Marvin Attack », rsa < aucune version corrigée
      # à ce jour) est un canal auxiliaire temporel sur les opérations de
      # clé PRIVÉE de la crate `rsa`. Vérifié dans ce dépôt : `rsa` n'y sert
      # jamais qu'à VÉRIFIER une signature avec une clé PUBLIQUE (CSR
      # entrantes dans oe-raflow, requêtes/réponses OCSP dans
      # oe-ocsp-core) — la clé privée de chaque service ne quitte jamais
      # le token PKCS#11 (voir oe-hsm::SigningToken). La seule opération de
      # clé privée par `rsa` est oe_hsm::testing::SoftwareToken, documentée
      # comme n'étant jamais utilisée en production. Ignoré ici faute de
      # correctif amont disponible ; à retirer dès qu'un correctif existe.
      #
      # Binaire précompilé : `cargo install cargo-audit` le recompilait à
      # chaque exécution (près de 3 minutes).
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit

      # RUSTSEC-2023-0071 (rsa, Marvin) est écarté parce qu'aucun binaire de
      # production ne fait d'opération privée avec la crate : voir
      # docs/ARCHITECTURE.md §10 et l'étape de garde ci-dessous (constat S-1).
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071

      # Constat H-2 : SoftwareToken garde la clé privée en mémoire du processus.
      # Aucun binaire de production ne doit la compiler (feature `testing`
      # d'oe-hsm, réservée aux [dev-dependencies]).
      - name: SoftwareToken absent des binaires de production
        run: |
          if cargo tree --workspace -e normal,build -i oe-hsm -f '{p} [{f}]' | grep -q 'testing'; then
            cargo tree --workspace -e normal,build -i oe-hsm -f '{p} [{f}]'
            echo "la feature testing d'oe-hsm est active dans le graphe de production" >&2
            exit 1
          fi

  licenses:
    name: Licences des dépendances (EUPL-1.2 / AGPL-3.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Politique dans deny.toml : licences permissives et MPL-2.0 admises,
      # tout copyleft qui ferait changer la licence du binaire refusé sauf
      # exception humaine consignée. Lancé sur toutes les fonctionnalités.
      - name: cargo deny check licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses

  conformance:
    name: Matrice de conformité ETSI
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # La sous-commande sort en échec si la matrice est incohérente : une
      # exigence déclarée couverte sans mécanisme ni test nommé, ou un écart
      # sans cible de levée. C'est ce qui empêche docs/CONFORMITE-ETSI.md de
      # se vider de son sens au fil des modifications.
      - name: Vérifie la cohérence de la matrice
        run: cargo run --bin ca-server -- conformance

      # Le document publié est rendu depuis le code : s'il en diverge, c'est
      # qu'il a été modifié à la main, ce qui n'a pas de sens ici.
      - name: Vérifie que docs/CONFORMITE-ETSI.md est à jour
        run: |
          cargo run --bin ca-server -- conformance --markdown > /tmp/conformite.md
          if ! diff -u docs/CONFORMITE-ETSI.md /tmp/conformite.md; then
            echo "docs/CONFORMITE-ETSI.md est désynchronisé : lancez 'make conformance-doc'" >&2
            exit 1
          fi

  # Une matrice plutôt que 3 constructions séquentielles dans un seul job :
  # CA/TSA/OCSP tournent en parallèle sur 3 runners, comme le job publish
  # ci-dessous — c'est ce qui faisait traîner la CI (~3x le temps d'une
  # seule image, compilation Rust + scan Trivy compris).
  build:
    # Sans référencer explicitement matrix.image ici, GitHub affiche toutes
    # les clés de la matrice dans le nom du check (illisible, et ça aurait
    # changé le nom à chaque modification d'un champ interne comme
    # dockerfile ou pin_env).
    name: Construction et scan des images (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: CA
            dockerfile: deploy/ca-server/Dockerfile
            tag: openeidas-ca:ci
            scope: ca
            # SoftHSM exige un PIN de 4 à 255 caractères : l'entrypoint
            # initialise ses tokens avant d'exécuter n'importe quelle
            # sous-commande, y compris `version`.
            pin_env: OPENEIDAS_ISSUING_PIN
          - image: TSA
            dockerfile: deploy/tsa/Dockerfile
            tag: openeidas-tsa:ci
            scope: tsa
            pin_env: OPENEIDAS_PIN
          - image: répondeur OCSP
            dockerfile: deploy/ocsp-responder/Dockerfile
            tag: openeidas-ocsp-responder:ci
            scope: ocsp-responder
            pin_env: OPENEIDAS_PIN
          # Console d'exploitation : aucun token, donc aucun PIN, et pas de
          # sous-commande `version` (option `--version`, clap).
          - image: console RA
            dockerfile: deploy/ra-console/Dockerfile
            tag: openeidas-ra-console:ci
            scope: ra-console
            version_arg: --version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Un cache par image (scope) : sans lui, les quatre constructions
      # écrivent dans le même cache et chacune écrase celui des autres.
      #
      # cache-from/cache-to: type=gha rejoue sinon indéfiniment la couche
      # apt-get de chaque Dockerfile, gelant les paquets Debian installés à
      # leur version du premier build mis en cache — c'est ce qui a laissé
      # passer un correctif de sécurité (libpcre2-8-0) malgré apt-get
      # update. CACHEBUST change une fois par jour pour forcer sa
      # réexécution au moins quotidiennement.
      - name: Calcule le cache-bust journalier
        id: cachebust
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Construit l'image (sans publication)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
          build-args: |
            VERSION=${{ github.sha }}
            CACHEBUST=${{ steps.cachebust.outputs.value }}

      - name: Vérifie que le binaire démarre
        run: docker run --rm ${{ matrix.pin_env && format('-e {0}=1234', matrix.pin_env) || '' }} ${{ matrix.tag }} ${{ matrix.version_arg || 'version' }}

      - name: Scan de vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # Un package GHCR nouvellement créé par GITHUB_TOKEN est parfois privé par
  # défaut malgré un dépôt public : après le tout premier passage de ce job,
  # vérifier la visibilité de chaque package sur
  # https://github.com/orgs/otspi/packages et la passer sur « Public »
  # si nécessaire (Package settings > Change visibility).
  publish:
    name: Publication des images (GHCR)
    runs-on: ubuntu-latest
    # `test` explicitement : le job build ne l'attend plus (il tourne en
    # parallèle), et rien ne se publie sans tests verts.
    needs: [build, test]
    # Seuls les push sur dev publient : une pull_request (y compris depuis
    # un fork) n'a pas vocation à pousser d'image, et GITHUB_TOKEN y est de
    # toute façon en lecture seule.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    # id-token : signature sans clé (cosign, OIDC de GitHub) ; attestations :
    # provenance SLSA de la construction (constat S-1).
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - image: open-eidas-ca
            dockerfile: deploy/ca-server/Dockerfile
            scope: ca
          - image: open-eidas-tsa
            dockerfile: deploy/tsa/Dockerfile
            scope: tsa
          - image: open-eidas-ocsp-responder
            dockerfile: deploy/ocsp-responder/Dockerfile
            scope: ocsp-responder
          # Image par défaut de raConsole.image dans le chart. Pas épinglée sur
          # le staging (job suivant) : la console n'y est pas déployée.
          - image: open-eidas-ra-console
            dockerfile: deploy/ra-console/Dockerfile
            scope: ra-console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Voir le commentaire équivalent du job build : sans cache-bust, le
      # cache GHA gèlerait les paquets Debian installés à leur version du
      # premier build en cache.
      - name: Calcule le cache-bust journalier
        id: cachebust
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # `sbom` et `provenance` : BuildKit joint à l'image un SBOM (SPDX) et une
      # attestation de provenance SLSA, lisibles par `docker buildx imagetools
      # inspect`.
      - name: Construit et publie l'image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/otspi/${{ matrix.image }}:latest
            ghcr.io/otspi/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
          build-args: |
            VERSION=${{ github.sha }}
            CACHEBUST=${{ steps.cachebust.outputs.value }}

      # Signature sans clé de l'image par son empreinte (jamais par un tag
      # mobile) : l'identité du signataire est ce workflow, sur cette branche.
      # Vérification : cosign verify --certificate-identity-regexp
      # '^https://github.com/otspi/open-eidas/' --certificate-oidc-issuer
      # https://token.actions.githubusercontent.com ghcr.io/otspi/<image>@<digest>
      - name: Signe l'image (cosign, sans clé)
        run: cosign sign --yes "ghcr.io/otspi/${{ matrix.image }}@${{ steps.build.outputs.digest }}"

  # Épingle les images de staging sur ce commit dans otspi/deploy —
  # jamais sur le cluster ni sur ArgoCD directement : cette CI n'a et
  # n'aura aucun accès à l'un ou l'autre. C'est le self-heal d'ArgoCD,
  # déjà configuré sur l'Application open-eidas-staging, qui applique le
  # changement une fois poussé ici.
  #
  # Nécessite que le secret organisation OPENEIDAS_DEPLOY_APP_ID (identifiant
  # de la GitHub App dédiée, écriture seule sur otspi/deploy) et le
  # secret OPENEIDAS_DEPLOY_APP_PRIVATE_KEY existent — sans eux, ce job est
  # ignoré (pas d'échec bloquant tant que la App n'est pas créée).
  pin-staging:
    name: Épingle les images de staging (otspi/deploy)
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - name: Vérifie que la GitHub App est configurée
        id: has-app
        run: |
          if [ -n "${{ secrets.OPENEIDAS_DEPLOY_APP_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENEIDAS_DEPLOY_APP_ID absent — pin de staging ignoré. Voir README pour créer la GitHub App dédiée."
          fi

      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app-token
        if: steps.has-app.outputs.configured == 'true'
        with:
          app-id: ${{ secrets.OPENEIDAS_DEPLOY_APP_ID }}
          private-key: ${{ secrets.OPENEIDAS_DEPLOY_APP_PRIVATE_KEY }}
          owner: otspi
          repositories: deploy

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.has-app.outputs.configured == 'true'
        with:
          repository: otspi/deploy
          token: ${{ steps.app-token.outputs.token }}

      - name: Met à jour les tags d'image dans apps/open-eidas-staging.yaml
        if: steps.has-app.outputs.configured == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/pin-staging-venv"
          "$RUNNER_TEMP/pin-staging-venv/bin/pip" install --quiet ruamel.yaml
          "$RUNNER_TEMP/pin-staging-venv/bin/python" - "$GITHUB_SHA" <<'PYEOF'
          import io, sys
          from ruamel.yaml import YAML
          from ruamel.yaml.scalarstring import LiteralScalarString

          # ruamel.yaml (round-trip) plutôt que PyYAML : préserve les
          # commentaires et le style bloc du fichier — un yaml.safe_load/dump
          # classique les efface tous à chaque pin.
          yaml = YAML()
          yaml.preserve_quotes = True
          yaml.indent(mapping=2, sequence=2, offset=0)

          sha = sys.argv[1]
          path = "apps/open-eidas-staging.yaml"

          with open(path) as f:
              doc = yaml.load(f)

          values = yaml.load(doc["spec"]["source"]["helm"]["values"])
          for component in ("ca", "tsa", "ocsp"):
              values.setdefault(component, {}).setdefault("image", {})["tag"] = sha

          buf = io.StringIO()
          yaml.dump(values, buf)
          doc["spec"]["source"]["helm"]["values"] = LiteralScalarString(buf.getvalue())

          with open(path, "w") as f:
              yaml.dump(doc, f)
          PYEOF

      - name: Commit et push si changement
        if: steps.has-app.outputs.configured == 'true'
        run: |
          git config user.name "open-eidas-deploy-bot[bot]"
          git config user.email "open-eidas-deploy-bot[bot]@users.noreply.github.com"
          git add apps/open-eidas-staging.yaml
          if git diff --cached --quiet; then
            echo "Aucun changement de tag, rien à pousser."
            exit 0
          fi
          git commit -m "Épingle le staging sur otspi/open-eidas@${GITHUB_SHA}"
          git push origin main

  frontend:
    name: Frontend de ra-console (typage, build, bout en bout)
    runs-on: ubuntu-latest
    # La console réelle tourne sur PostgreSQL (examples/e2e_console.rs), avec un
    # opérateur dont la clé est confiée à l'authentificateur WebAuthn virtuel de
    # Chromium : connexion, déconnexion et verrouillage sont prouvés dans un vrai
    # navigateur, en-têtes de sécurité et CSP compris (docs/UI-UX.md §6.3).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: bin/ra-console/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bin/ra-console/web/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Dépendances de développement (jamais dans l'image)
        run: npm ci

      - name: Typage strict (navigateur et tests)
        run: npm run typecheck

      - name: web/dist correspond aux sources
        # Les assets sont versionnés pour que la compilation Rust n'exige pas
        # Node ; un dist/ désynchronisé servirait autre chose que le code relu.
        run: |
          npm run build
          git diff --exit-code -- dist || {
            echo "::error::web/dist est désynchronisé : lancez 'npm run build' dans bin/ra-console/web"
            exit 1
          }

      - name: Navigateur de test
        run: npx playwright install --with-deps chromium

      - name: Parcours de bout en bout (Playwright)
        env:
          OE_CASTORE_TEST_DSN: postgres://postgres:test@localhost:5432/postgres
        run: npx playwright test

      - name: Rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: bin/ra-console/web/playwright-report
          retention-days: 7

  helm-lint:
    name: Lint du chart Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: helm lint
        run: helm lint deploy/helm/open-eidas
      - name: helm template (rendu complet)
        run: helm template open-eidas deploy/helm/open-eidas > /dev/null
      - name: helm template refuse l'approbation automatique en production
        # Constat R-2 : le rendu doit échouer, pas seulement le documenter.
        run: |
          if helm template open-eidas deploy/helm/open-eidas \
              --set production=true --set ca.autoApprove.enabled=true > /dev/null 2>&1; then
            echo "le chart accepte ca.autoApprove.enabled avec production=true" >&2
            exit 1
          fi
          helm template open-eidas deploy/helm/open-eidas \
            --set production=true --set enroll.requestersSecret=demandeurs > /dev/null
      - name: helm template refuse la production sans demandeurs d'enrôlement
        # Constat R-3 : un secret partagé par tous les demandeurs n'est pas admis.
        run: |
          if helm template open-eidas deploy/helm/open-eidas \
              --set production=true > /dev/null 2>&1; then
            echo "le chart accepte production=true sans enroll.requestersSecret" >&2
            exit 1
          fi
      - name: helm template refuse une copie S3 du journal à moitié configurée
        # Constat J-1 : un point d'accès sans compartiment ni identifiants ne
        # doit pas rendre un service qui ne copie rien en silence.
        run: |
          if helm template open-eidas deploy/helm/open-eidas \
              --set tsa.audit.s3.endpoint=https://s3.example.test > /dev/null 2>&1; then
            echo "le chart accepte tsa.audit.s3.endpoint sans compartiment ni Secret" >&2
            exit 1
          fi
          helm template open-eidas deploy/helm/open-eidas \
            --set tsa.audit.s3.endpoint=https://s3.example.test \
            --set tsa.audit.s3.bucket=journaux \
            --set tsa.audit.s3.existingSecret=s3-journal > /dev/null
      - name: helm template pose la limite de débit de la TSA à la demande
        # Désactivée par défaut ; demandée, elle doit produire la politique.
        run: |
          if helm template open-eidas deploy/helm/open-eidas | grep -q BackendTrafficPolicy; then
            echo "la limite de débit est posée sans avoir été demandée" >&2
            exit 1
          fi
          helm template open-eidas deploy/helm/open-eidas \
            --set tsa.gateway.enabled=true --set tsa.gateway.rateLimit.enabled=true \
            | grep -q BackendTrafficPolicy
      - name: helm lint et rendu avec ra-console
        run: |
          helm lint deploy/helm/open-eidas -f deploy/helm/open-eidas/ci/ra-console-values.yaml
          helm template open-eidas deploy/helm/open-eidas \
            -f deploy/helm/open-eidas/ci/ra-console-values.yaml > /dev/null
      - name: helm template refuse ra-console sans le lien interne de la CA
        # La console n'agit que par le lien interne : le rendu doit échouer,
        # pas déployer une console inutilisable. Valeurs complètes par
        # ailleurs : seule la garde peut faire échouer ce rendu.
        run: |
          if helm template open-eidas deploy/helm/open-eidas \
              -f deploy/helm/open-eidas/ci/ra-console-values.yaml \
              --set ca.internal.enabled=false > /dev/null 2>&1; then
            echo "le chart accepte raConsole.enabled sans ca.internal.enabled" >&2
            exit 1
          fi
      - name: Le script des droits du chart est celui du dépôt
        # Helm ne lit pas de fichier hors du chart : files/ en porte une copie,
        # qui ne doit jamais diverger de l'original.
        run: |
          diff -u crates/oe-castore/sql/ra_console_grants.sql \
            deploy/helm/open-eidas/files/ra_console_grants.sql

  helm-kind-smoke-test:
    name: Amorçage complet + démonstration (Helm sur kind)
    runs-on: ubuntu-latest
    needs: [build, helm-lint]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Calcule le cache-bust journalier
        id: cachebust
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Mêmes arguments et même cache que le job build, dont ce job dépend :
      # les trois images en sortent sans recompilation.
      - name: Construit l'image de la CA
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/ca-server/Dockerfile
          push: false
          load: true
          tags: openeidas-ca:ci
          cache-from: type=gha,scope=ca
          build-args: |
            VERSION=${{ github.sha }}
            CACHEBUST=${{ steps.cachebust.outputs.value }}

      - name: Construit l'image TSA
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/tsa/Dockerfile
          push: false
          load: true
          tags: openeidas-tsa:ci
          cache-from: type=gha,scope=tsa
          build-args: |
            VERSION=${{ github.sha }}
            CACHEBUST=${{ steps.cachebust.outputs.value }}

      - name: Construit l'image du répondeur OCSP
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/ocsp-responder/Dockerfile
          push: false
          load: true
          tags: openeidas-ocsp-responder:ci
          cache-from: type=gha,scope=ocsp-responder
          build-args: |
            VERSION=${{ github.sha }}
            CACHEBUST=${{ steps.cachebust.outputs.value }}

      - name: Crée un cluster kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: open-eidas

      - name: Charge les images dans kind
        run: |
          kind load docker-image openeidas-ca:ci --name open-eidas
          kind load docker-image openeidas-tsa:ci --name open-eidas
          kind load docker-image openeidas-ocsp-responder:ci --name open-eidas

      - name: Installe le chart
        run: |
          helm install open-eidas deploy/helm/open-eidas \
            --namespace open-eidas --create-namespace \
            --set ca.image.repository=openeidas-ca \
            --set ca.image.tag=ci \
            --set ca.autoApprove.enabled=true \
            --set tsa.image.repository=openeidas-tsa \
            --set tsa.image.tag=ci \
            --set tsa.time.policy=monitor \
            --set tsa.crossTSA.urls= \
            --set ocsp.image.repository=openeidas-ocsp-responder \
            --set ocsp.image.tag=ci

      - name: Attend que tous les pods soient prêts
        # L'essentiel de l'attente est la génération de quatre bi-clés RSA
        # dans SoftHSM (deux pour la hiérarchie de CA en 4096 bits, une par
        # service signataire en 3072) : quelques minutes sur un runner
        # partagé. 6 minutes laissent une marge confortable.
        run: |
          kubectl -n open-eidas wait --for=condition=ready pod --all --timeout=6m

      - name: Horodate un fichier et vérifie le jeton (openssl ts)
        run: |
          kubectl -n open-eidas port-forward svc/open-eidas-tsa 8318:8318 &
          sleep 3
          echo "facture CI $(date -Is)" > facture.txt
          openssl ts -query -data facture.txt -sha256 -cert -out facture.tsq
          curl -sf -H 'Content-Type: application/timestamp-query' \
              --data-binary @facture.tsq http://localhost:8318/tsa -o facture.tsr
          curl -sf http://localhost:8318/api/v1/certificate -o chain.pem
          awk '/BEGIN CERTIFICATE/{n++} {print > (n == 1 ? "tsu.pem" : "ca.pem")}' chain.pem
          openssl ts -verify -in facture.tsr -queryfile facture.tsq -CAfile ca.pem

      # Le moteur de CA est maison : il ne peut pas se valider avec ses seuls
      # outils. openssl relit ici, indépendamment, ce qu'il a produit.
      - name: Vérifie le certificat TSU et la CRL avec openssl
        run: |
          kubectl -n open-eidas port-forward svc/open-eidas-ca 8320:8320 &
          sleep 3
          openssl verify -CAfile ca.pem -purpose timestampsign tsu.pem
          openssl x509 -in tsu.pem -noout -text | grep -q "Time Stamping"
          CRL_URL="$(openssl x509 -in tsu.pem -noout -text \
            | grep -A 2 "X509v3 CRL Distribution" | sed -n 's/.*URI://p' | tr -d ' ')"
          curl -sf "http://localhost:8320/${CRL_URL#*://*/}" -o issuing.crl
          openssl crl -inform DER -in issuing.crl -CAfile ca.pem -noout
          # Constat C-4 : la CRL déclare conserver les révoqués expirés
          # (ExpiredCertsOnCRL, 2.5.29.60, que openssl affiche par son OID).
          openssl crl -inform DER -in issuing.crl -noout -text | grep -q "2.5.29.60"

      - name: Rapport de conformité de l'instance déployée
        run: |
          curl -sf http://localhost:8320/api/v1/conformance \
            | tee conformance.json | head -c 400
          grep -q '"matrice_coherente": *true' conformance.json

      # Avec nonce (RFC 8954, constat O-2) : openssl l'exige en retour quand
      # il l'a envoyé et avertit sinon ("no nonce in response").
      - name: Interroge le répondeur OCSP pour le certificat TSU
        run: |
          kubectl -n open-eidas port-forward svc/open-eidas-ocsp 8319:8319 &
          sleep 3
          openssl ocsp -issuer ca.pem -cert tsu.pem -CAfile ca.pem -nonce \
              -url http://localhost:8319/ocsp -resp_text 2>&1 | tee ocsp-response.txt
          grep -q "tsu.pem: good" ocsp-response.txt
          grep -q "Response verify OK" ocsp-response.txt
          if grep -qiE "no nonce in response|nonce verify error" ocsp-response.txt; then
            echo "openssl se plaint du nonce" >&2
            exit 1
          fi

      # Constat O-1 (EN 319 411-1 OVR-6.6.3-02) : un numéro de série que cette
      # CA n'a jamais émis reçoit `unknown`, jamais `good` par défaut.
      - name: Interroge le répondeur OCSP pour un numéro jamais émis
        run: |
          kubectl -n open-eidas port-forward svc/open-eidas-ocsp 8329:8319 &
          sleep 3
          openssl ocsp -issuer ca.pem -serial 0x7e57 -CAfile ca.pem -no_nonce \
              -url http://localhost:8329/ocsp -resp_text | tee ocsp-unknown.txt
          grep -q "0x7e57: unknown" ocsp-unknown.txt

      - name: Vérifie la chaîne des journaux d'audit (TSA et CA)
        run: |
          kubectl -n open-eidas exec deploy/open-eidas-tsa -- tsa-server verify-audit
          kubectl -n open-eidas exec deploy/open-eidas-ca -c ca -- ca-server verify-audit

      # Le journal de la CA est scellé par la TSA de la release, en HTTP
      # (constat J-1) : la TSA démarre après la CA, la première passe échoue
      # et est reprise au bout d'une minute. On attend ce premier sceau.
      - name: Vérifie que la CA a fait sceller son journal par la TSA
        run: |
          for i in $(seq 1 30); do
            if kubectl -n open-eidas exec deploy/open-eidas-ca -c ca -- ca-server verify-audit \
                | grep -Eq 'scellements +: [1-9]'; then
              exit 0
            fi
            sleep 5
          done
          kubectl -n open-eidas exec deploy/open-eidas-ca -c ca -- ca-server verify-audit
          echo "aucun sceau de la TSA dans le journal de la CA" >&2
          exit 1

      # L'approbation est ce qu'un auditeur vient vérifier : elle doit être
      # nominative et tracée, y compris lorsque l'opérateur est technique.
      - name: Vérifie que chaque émission a été approuvée par un opérateur nommé
        run: |
          kubectl -n open-eidas exec deploy/open-eidas-ca -c ca -- \
            ca-server ra list ISSUED | tee requests.txt
          grep -q "ci-bootstrap" requests.txt

      - name: État des pods et journaux (utile en cas d'échec)
        if: always()
        run: |
          kubectl -n open-eidas get pods -o wide
          kubectl -n open-eidas describe pods
          for c in ca ra-autoapprove; do
            echo "=== ca / $c ==="
            kubectl -n open-eidas logs deploy/open-eidas-ca -c "$c" --tail 200 || true
          done
          echo "=== postgres ==="
          kubectl -n open-eidas logs statefulset/open-eidas-postgres --tail 100 || true
          echo "=== tsa ==="
          kubectl -n open-eidas logs deploy/open-eidas-tsa --tail 200 || true
          echo "=== ocsp ==="
          kubectl -n open-eidas logs deploy/open-eidas-ocsp --tail 200 || true

  compose-smoke-test:
    name: Amorçage complet + démonstration (docker compose)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Amorce la pile (CA + TSA + répondeur OCSP)
        # Les runners GitHub-hébergés ne garantissent pas de sortie UDP/123 vers
        # les deux serveurs NTP externes exigés par la politique "enforce" ; le
        # job helm-kind-smoke-test contourne déjà ce même aléa réseau en passant
        # tsa.time.policy=monitor.
        env:
          OPENEIDAS_TIME_POLICY: monitor
          # Pas de TSA publique sollicitée à chaque exécution de la CI : le
          # contreseing est prouvé par bin/tsa-server/tests/serve.rs.
          OPENEIDAS_CROSS_TSA_URLS: ""
        run: ./scripts/bootstrap.sh

      - name: Horodate un fichier et vérifie le jeton (openssl ts)
        run: ./scripts/demo.sh

      - name: Vérifie la chaîne des journaux d'audit (TSA et CA)
        run: |
          docker compose exec -T tsa tsa-server verify-audit
          docker compose exec -T ca ca-server verify-audit

      # Le journal de la CA est scellé par la TSA, en HTTP (constat J-1) : la
      # TSA démarre après la CA, la première passe échoue et est reprise au
      # bout d'une minute. On attend ce premier sceau, visible dans /healthz
      # (journal.last_seal) et compté par verify-audit.
      - name: Vérifie que la CA a fait sceller son journal par la TSA
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8320/healthz | grep -q '"last_seal":"20'; then
              break
            fi
            sleep 5
          done
          curl -fsS http://localhost:8320/healthz | tee healthz-ca.json
          grep -q '"last_seal":"20' healthz-ca.json
          docker compose exec -T ca ca-server verify-audit | tee verify-ca.txt
          grep -Eq 'scellements +: [1-9]' verify-ca.txt

      - name: Journaux (utile en cas d'échec)
        if: always()
        run: docker compose logs --tail 200

      - name: Arrête la pile
        if: always()
        run: docker compose down -v
