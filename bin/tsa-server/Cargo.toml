[package]
name = "tsa-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portage Rust de cmd/tsa-server (RFC 3161 qualifiée eIDAS)."

[lints]
workspace = true

[[bin]]
name = "tsa-server"
path = "src/main.rs"

[dependencies]
oe-config = { path = "../../crates/oe-config" }
oe-conformance = { path = "../../crates/oe-conformance" }
oe-hsm = { path = "../../crates/oe-hsm" }
oe-certs = { path = "../../crates/oe-certs" }
oe-audit = { path = "../../crates/oe-audit" }
oe-timesource = { path = "../../crates/oe-timesource" }
oe-tsa-core = { path = "../../crates/oe-tsa-core" }
oe-httpapi = { path = "../../crates/oe-httpapi" }
oe-enroll = { path = "../../crates/oe-enroll" }
oe-seal = { path = "../../crates/oe-seal" }
oe-s3 = { path = "../../crates/oe-s3" }
oe-rfc3161-asn1 = { path = "../../crates/oe-rfc3161-asn1" }
clap = { version = "4", features = ["derive"] }
der = "0.8"
serde_json = "1"
time = { version = "0.3", features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
axum = "0.8"

[dev-dependencies]
base64 = "0.22"
oe-ca-core = { path = "../../crates/oe-ca-core" }
oe-castore = { path = "../../crates/oe-castore" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
pem = "3"
x509-cert = "0.3"
