[package]
name = "ca-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portage Rust de cmd/ca-server : autorité de certification et d'enregistrement."

[lints]
workspace = true

[[bin]]
name = "ca-server"
path = "src/main.rs"

[dependencies]
oe-hsm = { path = "../../crates/oe-hsm" }
oe-certs = { path = "../../crates/oe-certs" }
oe-castore = { path = "../../crates/oe-castore", features = ["postgres"] }
# Copie du journal sur un stockage objet compatible S3, auto-hébergé
# (docs/WEBUI.md §7, §15 étape 2b) : jamais AWS, décision de l'association.
oe-s3 = { path = "../../crates/oe-s3" }
oe-ca-core = { path = "../../crates/oe-ca-core" }
oe-raflow = { path = "../../crates/oe-raflow" }
oe-actions = { path = "../../crates/oe-actions" }
oe-audit = { path = "../../crates/oe-audit" }
oe-webauthn = { path = "../../crates/oe-webauthn" }
oe-enroll = { path = "../../crates/oe-enroll" }
oe-conformance = { path = "../../crates/oe-conformance" }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
der = { version = "0.8", features = ["pem", "std"] }
x509-cert = "0.3"
time = { version = "0.3", features = ["std", "formatting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = { version = "1", features = ["std"] }
rsa = "0.9"
async-trait = "0.1"
rand = "0.8"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
webauthn-authenticator-rs = { version = "0.5", features = ["softtoken"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
