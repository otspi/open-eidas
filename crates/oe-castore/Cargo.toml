[package]
name = "oe-castore"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "État persistant de l'autorité de certification (autorités, registre, demandes, CRL) — portage de internal/castore."

[lints]
workspace = true

[features]
postgres = ["dep:sqlx"]

[dependencies]
async-trait = "0.1"
time = { version = "0.3", features = ["std"] }
thiserror = "2"
hex = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "time", "macros", "migrate"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rand = "0.8"
