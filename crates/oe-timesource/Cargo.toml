[package]
name = "oe-timesource"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Surveillance NTP multi-sources conforme ETSI EN 319 421 §7.7.2 (portage de internal/timesource)."

[lints]
workspace = true

[dependencies]
thiserror = "2"
time = { version = "0.3", features = ["std", "formatting", "parsing", "macros"] }
serde_json = "1"
# Bits de poids faible aléatoires du transmit timestamp (RFC 5905 §8, constat T-2).
rand = "0.8"
# NTS (RFC 8915, constat T-2, tranche T-c) : NTS-KE en TLS 1.3 et AEAD AES-SIV-CMAC-256.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
aes-siv = "0.7"
# Serveur NTS de test (`testing`) : certificat fabriqué par openssl, lu en PEM.
pem = "3"
