[package]
name = "oe-raflow"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Machine à états d'enrôlement et d'approbation de l'autorité d'enregistrement (RA) — portage de internal/raflow."

[lints]
workspace = true

[dependencies]
oe-castore = { path = "../oe-castore" }
oe-ca-core = { path = "../oe-ca-core" }
der = "0.8"
x509-cert = "0.3"
rsa = "0.9"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
time = { version = "0.3", features = ["std"] }
thiserror = "2"
serde_json = "1"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
oe-hsm = { path = "../oe-hsm" }
oe-conformance = { path = "../oe-conformance" }
spki = "0.8"
rand = "0.8"
