[package]
name = "oe-hsm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Accès à la clé de signature de la TSU via PKCS#11 — la clé privée ne quitte jamais le token (portage de internal/hsm)."

[lints]
# oe-hsm est la seule crate du workspace autorisée à contenir du unsafe : les
# bindings PKCS#11 en dépendent. Toute autre crate doit rester #![forbid(unsafe_code)].

[features]
default = ["pkcs11"]
# Le token PKCS#11 et `cryptoki`. Un service qui n'ouvre jamais de session PKCS#11
# (ra-console, docs/WEBUI.md §16) la désactive et ne compile pas `cryptoki`.
pkcs11 = ["dep:cryptoki"]
# `oe_hsm::testing::SoftwareToken` : la clé privée vit en mémoire du processus.
# Réservée aux tests (constat H-2 de l'audit du 2026-09-25) : les crates qui en
# ont besoin l'activent dans leurs `[dev-dependencies]`, jamais en dépendance
# normale — un binaire de production ne la contient pas.
testing = []

[dependencies]
cryptoki = { version = "0.12", optional = true }
sha2 = { version = "0.10", features = ["oid"] }
thiserror = "2"
rsa = "0.9"
rand = "0.8"

[dev-dependencies]
hex = "0.4"
