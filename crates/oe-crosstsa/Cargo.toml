[package]
name = "oe-crosstsa"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Contreseing de la tête du journal d'audit par des TSA RFC 3161 tierces — portage de internal/crosstsa."

[lints]
workspace = true

[dependencies]
oe-rfc3161-asn1 = { path = "../oe-rfc3161-asn1" }
cms = "0.3.0-pre.2"
der = "0.8"
spki = "0.8"
x509-cert = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
hex = "0.4"
time = { version = "0.3", features = ["formatting"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
oe-hsm = { path = "../oe-hsm", features = ["testing"] }
oe-tsa-core = { path = "../oe-tsa-core" }
oe-httpapi = { path = "../oe-httpapi" }
oe-timesource = { path = "../oe-timesource" }
sha2 = "0.10"
pem = "3"
axum = "0.8"
