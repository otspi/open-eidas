[package]
name = "oe-ca-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Moteur d'émission et de révocation de la CA (profils, cérémonie, CRL) — portage de internal/ca."

[lints]
workspace = true

[dependencies]
# `default-features = false` : ce crate n'utilise que le trait `SigningToken`
# générique, jamais `Pkcs11Token` directement. Sans ce réglage, un binaire qui
# dépend d'`oe-ca-core` sans avoir besoin d'ouvrir de session PKCS#11 (aucun
# aujourd'hui, mais un futur consommateur en lecture seule y serait exposé)
# lierait quand même `cryptoki` : les fonctionnalités d'une dépendance de chemin
# partagée s'unifient sur tout le graphe d'un même binaire. `ca-server`, qui a
# besoin de `Pkcs11Token`, la redemande explicitement dans son propre
# `Cargo.toml`.
oe-hsm = { path = "../oe-hsm", default-features = false }
oe-certs = { path = "../oe-certs" }
oe-castore = { path = "../oe-castore" }
oe-conformance = { path = "../oe-conformance" }
der = "0.8"
x509-cert = { version = "0.3", features = ["builder", "hazmat"] }
spki = "0.8"
signature = "3"
sha2 = "0.10"
sha1 = "0.10"
rand = "0.8"
time = { version = "0.3", features = ["std", "formatting"] }
thiserror = "2"
tracing = "0.1"
serde_json = "1"
hex = "0.4"
async-trait = "0.1"

[dev-dependencies]
oe-hsm = { path = "../oe-hsm", default-features = false, features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
base64 = "0.22"
