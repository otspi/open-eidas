[package]
name = "oe-httpapi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Expose l'autorité d'horodatage en HTTP (RFC 3161 binaire + façade JSON) — portage de internal/httpapi."

[lints]
workspace = true

[dependencies]
oe-tsa-core = { path = "../oe-tsa-core" }
oe-audit = { path = "../oe-audit" }
oe-rfc3161-asn1 = { path = "../oe-rfc3161-asn1" }
oe-hsm = { path = "../oe-hsm" }
oe-timesource = { path = "../oe-timesource" }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "limit", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
der = "0.8"
spki = "0.8"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
pem = "3"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
oe-hsm = { path = "../oe-hsm", features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
x509-cert = "0.3"
