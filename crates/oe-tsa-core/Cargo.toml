[package]
name = "oe-tsa-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cœur métier de l'horodatage RFC 3161 (Authority::timestamp) — portage de internal/tsa."

[lints]
workspace = true

[dependencies]
oe-rfc3161-asn1 = { path = "../oe-rfc3161-asn1" }
oe-hsm = { path = "../oe-hsm" }
oe-conformance = { path = "../oe-conformance" }
der = "0.8"
x509-cert = "0.3"
spki = "0.8"
sha2 = "0.10"
rand = "0.8"
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["std", "formatting"] }

[dev-dependencies]
hex = "0.4"
pem = "3"
