# Valeurs par défaut du chart Open eIDAS.
#
# Ce chart reproduit, en Kubernetes, exactement la pile du docker-compose de
# démonstration : PostgreSQL, l'autorité de certification maison (racine +
# CA émettrice, cf. cmd/ca-server), un serveur WebDAV de réplication du
# journal d'audit, le répondeur OCSP et le service d'horodatage lui-même. Il
# est destiné à un déploiement piloté par ArgoCD (voir
# deploy/argocd/application.yaml) mais s'installe aussi bien en `helm install`
# direct.
#
# AVERTISSEMENT — comme le docker-compose, ce chart est une démonstration :
# cérémonie de clé sans double contrôle, approbation RA automatisable sous un
# compte technique (désactivée par défaut, voir ca.autoApprove), SoftHSM en lieu d'un HSM certifié. Voir
# docs/CONFORMITE-ETSI.md pour l'état exigence par exigence,
# docs/ARCHITECTURE.md pour les écarts au référentiel eIDAS et
# deploy/helm/open-eidas/README.md pour les adaptations nécessaires à un
# déploiement de production.

nameOverride: ""
fullnameOverride: ""

# Déploiement destiné à la qualification ou à la production. Refuse le rendu
# du chart tant qu'un raccourci de démonstration reste actif (aujourd'hui :
# ca.autoApprove.enabled) plutôt que de le laisser hériter par oubli (constat
# R-2 de l'audit du 2026-09-25, ETSI EN 319 411-1 GEN-6.5.5-04).
production: false

# Politique de tirage d'image commune à tous les composants du chart.
imagePullPolicy: IfNotPresent

tsa:
  image:
    repository: ghcr.io/open-eidas/open-eidas-tsa
    tag: "latest"
  replicaCount: 1
  service:
    port: 8318
  # Dimensionné par mesure directe (voir docs/SIZING.md) : enrôlement et
  # signature sous charge stables dès 16Mi (usage observé jusqu'à 9,3Mi).
  # 32/128 garde une marge large.
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }
  persistence:
    softhsm:
      size: 256Mi
      storageClassName: ""
    state:
      size: 256Mi
      storageClassName: ""
  policyOID: "1.3.6.1.4.1.99999.1.1.1"
  # Seul le nom courant est choisi par le service : unité, organisation et
  # pays sont imposés par le profil côté autorité (internal/ca/profile.go),
  # de sorte qu'un service ne puisse pas se réclamer d'une autre organisation.
  subject:
    commonName: "Open eIDAS Time-Stamping Unit 1"
  time:
    policy: enforce # enforce | monitor | disabled
    sources: "ntp.obspm.fr,ptbtime1.ptb.de"
    minSources: 2
    maxOffset: 500ms
  # Scellement du journal et contreseing par des TSA tierces : valeurs
  # transmises au service, qui ne les exploite PAS encore (écart J-1, voir
  # docs/ARCHITECTURE.md §7).
  crossTSA:
    urls: "https://freetsa.org/tsr,http://timestamp.digicert.com"
  audit:
    sealInterval: 1h
  # PIN du token PKCS#11, généré aléatoirement et conservé dans un Secret
  # si laissé vide (voir templates/secret-generated.yaml).
  pin: ""
  # Origine autorisée à appeler l'API depuis un navigateur
  # (Access-Control-Allow-Origin) — ex. une démo web tierce. Vide = pas de
  # CORS, comportement par défaut.
  corsAllowedOrigin: ""
  # Exposition externe via Gateway API (HTTPRoute), pas Ingress : la
  # terminaison TLS est de la responsabilité du Gateway référencé, pas de ce
  # chart.
  gateway:
    enabled: false
    name: shared-gateway
    namespace: ingress
    host: tsa.open-eidas.example

ocsp:
  image:
    repository: ghcr.io/open-eidas/open-eidas-ocsp-responder
    tag: "latest"
  replicaCount: 1
  service:
    port: 8319
  # Dimensionné par mesure directe (voir docs/SIZING.md) : même profil que
  # la TSA, en plus léger (usage observé : 3,3Mi sous charge à 16Mi de
  # limite).
  resources:
    requests: { cpu: 15m, memory: 24Mi }
    limits: { cpu: 150m, memory: 96Mi }
  persistence:
    softhsm:
      size: 128Mi
      storageClassName: ""
    state:
      size: 128Mi
      storageClassName: ""
  # PIN du token PKCS#11 dédié à ce service, généré aléatoirement et
  # conservé dans un Secret si laissé vide (voir templates/secret-generated.yaml).
  pin: ""
  # Comme pour la TSA, seul le nom courant est choisi par le service.
  subject:
    commonName: "Open eIDAS OCSP Responder 1"
  # Adresse publique du répondeur, gravée dans l'extension AIA du certificat
  # TSU. Vide = déduite de l'ingress si activé, sinon du nom DNS interne au
  # cluster (non résoluble de l'extérieur — à fixer explicitement pour tout
  # déploiement dont le certificat sera vérifié par des tiers).
  publicURL: ""
  gateway:
    enabled: false
    name: shared-gateway
    namespace: ingress
    host: ocsp.open-eidas.example

# Autorité de certification et d'enregistrement (cmd/ca-server). Elle
# remplace OpenXPKI : voir INDEPENDANCE.md.
ca:
  image:
    repository: ghcr.io/open-eidas/open-eidas-ca
    tag: "latest"
  service:
    port: 8320
    # Second port, réservé au lien interne ra-console <-> ca-server
    # (docs/WEBUI.md §16-17). Il sert /internal/v1/* en mTLS, terminé par
    # ca-server lui-même, et n'a jamais de HTTPRoute : une NetworkPolicy ne voit
    # que les ports, pas les chemins.
    internalPort: 8321
  # Lien interne des actions signées par les opérateurs. Désactivé par défaut :
  # ra-console n'est pas encore déployable, et un port qui accepte des actions
  # privilégiées ne s'ouvre que sur décision explicite.
  internal:
    enabled: false
    # Nom DNS sous lequel ra-console joint ca-server, repris dans le SAN du
    # certificat `internal_server`. Vide = le nom du Service de la CA.
    dnsName: ""
    # Relying Party WebAuthn des opérateurs (docs/WEBUI.md §2) : rpId est le nom
    # d'hôte exact de l'origine, jamais le domaine racine. Obligatoires.
    webauthn:
      rpId: ""
      rpName: "Open eIDAS Console"
      origin: ""
    # Liste blanche de modèles de clés d'opérateur (décision O6) : une entrée par
    # modèle, avec la racine PEM de son attestation. Obligatoire, revue par PR.
    #   - description: "YubiKey 5 (série X)"
    #     aaguid: "00000000-0000-0000-0000-000000000000"
    #     rootPem: |
    #       -----BEGIN CERTIFICATE-----
    models: []
    # Sans NetworkPolicy, le port interne serait joignable de tout le cluster. Le
    # cluster doit faire appliquer les NetworkPolicy (CNI compatible).
    networkPolicy:
      enabled: true
  # Dimensionné par mesure directe (voir docs/SIZING.md) : la cérémonie de
  # clé (2x RSA-4096) réussit même au plancher minimal accepté par Docker
  # (6Mi) ; le régime `serve` sous charge réelle d'enrôlement est stable dès
  # 16Mi (usage observé : 4-5Mi). 32/128 garde une marge large. Le CPU
  # n'est limitant que pour la durée de la cérémonie (0,25 CPU -> ~9s,
  # 0,05 CPU -> ~40s) ; 1 CPU de limite la ramène sous la seconde.
  resources:
    requests: { cpu: 100m, memory: 32Mi }
    limits: { cpu: "1", memory: 128Mi }
  persistence:
    softhsm:
      size: 256Mi
      storageClassName: ""
    state:
      size: 256Mi
      storageClassName: ""
  # Taille des clés d'autorité. Une CA signe des certificats qui lui
  # survivent : 4096 bits plutôt que le minimum de 3072 exigé par
  # ETSI TS 119 312 pour les entités finales.
  keyBits: 4096
  rootCommonName: "Open eIDAS Root CA"
  issuingCommonName: "Open eIDAS Issuing CA"
  organization: "Open eIDAS"
  country: "FR"
  # Identité consignée au procès-verbal de cérémonie (ETSI EN 319 411-1
  # §6.5.1). En production, une personne nommée, pas un compte technique.
  ceremonyOperator: "ci-bootstrap"
  crl:
    # Écart entre thisUpdate et nextUpdate des CRL publiées.
    validity: 24h
    # Fréquence de republication : très en deçà de la validité, pour qu'une
    # CRL ne devienne jamais périmée du seul fait d'un cycle raté.
    refresh: 1h
  audit:
    # Durée de conservation du journal (ETSI EN 319 401 §7.10). Le service
    # refuse de démarrer en deçà d'un an.
    retention: 8760h
  # Approbation automatique des demandes d'enrôlement, pour que la
  # démonstration et la CI s'amorcent sans opérateur humain. DÉSACTIVÉE par
  # défaut (constat R-2 de l'audit du 2026-09-25) : une valeur par défaut
  # dangereuse est ce qu'un déploiement de production hérite par oubli. Sans
  # elle, un opérateur nommé approuve par
  # `kubectl exec … ca-server ra approve <transaction> <opérateur>`. Une
  # démonstration pose enabled: true (ÉCART ASSUMÉ : c'est alors un conteneur
  # nommé qui décide, sous une identité technique tracée au journal d'audit).
  # Refusée au rendu si production: true.
  autoApprove:
    enabled: false
    operator: "ci-bootstrap"
    intervalSeconds: 5
    # N'ouvre aucun token PKCS#11 (voir plus haut : approuver, c'est
    # décider, pas signer) — footprint minimal.
    resources:
      requests: { cpu: 5m, memory: 16Mi }
      limits: { cpu: 50m, memory: 64Mi }
  # Adresse publique de la CA, gravée dans les points de distribution de CRL
  # et d'accès au certificat de la CA émettrice (CDP/AIA) des certificats
  # émis. Vide = déduite de l'ingress si activé, sinon du nom DNS interne au
  # cluster (non résoluble de l'extérieur — à fixer explicitement pour tout
  # déploiement dont les certificats seront vérifiés par des tiers).
  publicURL: ""
  gateway:
    enabled: false
    name: shared-gateway
    namespace: ingress
    host: pki.open-eidas.example

# Console d'exploitation RA/CA (bin/ra-console, docs/WEBUI.md §16-17,
# docs/RA-CONSOLE.md). DÉSACTIVÉE par défaut : elle exige le lien interne de la
# CA (ca.internal.enabled, refusé au rendu sinon), dont elle réutilise la
# configuration WebAuthn et la liste blanche de modèles de clés — une seule
# Relying Party, pas deux réglages qui pourraient diverger.
raConsole:
  enabled: false
  image:
    repository: ghcr.io/open-eidas/open-eidas-ra-console
    tag: "latest"
  service:
    port: 8330
  # Purge des sessions et challenges expirés (secondes).
  purgeIntervalSeconds: 60
  # Délai d'attente de l'approbation du certificat client `internal_client` au
  # premier démarrage, par tentative (secondes).
  enrollTimeoutSeconds: 600
  # Exposition au navigateur des opérateurs, par une Gateway INTERNE (jamais
  # une Gateway publique : la console est le composant le plus exposé, §16).
  # L'hôte doit correspondre à ca.internal.webauthn.origin.
  gateway:
    enabled: false
    name: internal-gateway
    namespace: ingress
    host: console.open-eidas.example
  # Seul le namespace de la Gateway ci-dessus atteint la console ; en sortie,
  # seuls le DNS, PostgreSQL et la CA (API publique et port interne).
  networkPolicy:
    enabled: true
  # Application des droits du rôle PostgreSQL en lecture seule
  # (crates/oe-castore/sql/ra_console_grants.sql, copié dans files/ du chart)
  # par un Job, hook post-install/post-upgrade : les identifiants
  # d'administration de la base n'entrent jamais dans le pod de la console.
  # Le compte postgres.user doit pouvoir créer un rôle (CREATEROLE) : c'est le
  # cas du StatefulSet intégré ; pour une base externe, à vérifier.
  grantsJob:
    timeoutSeconds: 900
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }
  persistence:
    # Clé et certificat client du lien interne, certificat de la CA, journal
    # d'audit chaîné de la console.
    state:
      size: 256Mi
      storageClassName: ""

postgres:
  image:
    repository: postgres
    tag: "17-alpine"
  # Dimensionné par mesure directe (voir docs/SIZING.md) : échec net (OOM
  # pendant initdb) en dessous de 32Mi, marche fiable dès 40Mi. 64/256
  # laisse une marge confortable sans sur-provisionner.
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  persistence:
    size: 1Gi
    storageClassName: ""
  database: openeidas
  user: openeidas
  # PostgreSQL externe (ex. un Cluster CloudNativePG géré hors de ce chart) :
  # le StatefulSet postgres intégré n'est alors ni créé ni utilisé. Le mot de
  # passe reste lu depuis la clé "postgres-password" du Secret désigné par
  # secrets.existingSecret, qui doit correspondre à celui de la base externe.
  external:
    enabled: false
    host: ""
    port: 5432

# Nom d'un Secret existant à utiliser à la place de celui généré par
# templates/secrets/generated.yaml (motif `lookup`, voir ce fichier). Doit
# contenir les mêmes clés (postgres-password, tsa-pin, ocsp-pin,
# ca-root-pin, ca-issuing-pin, webdav-password, enroll-hmac-key, et, avec
# raConsole.enabled, ra-console-db-password et ra-console-decoy-secret) : c'est le
# mécanisme prévu pour committer ces secrets scellés (kubeseal) dans un dépôt
# de déploiement plutôt que de les laisser générer sur le cluster.
secrets:
  existingSecret: ""

auditReplica:
  image:
    repository: bytemark/webdav
    tag: "2.4"
  username: openeidas
  # Mot de passe généré aléatoirement si laissé vide.
  password: ""
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { cpu: 100m, memory: 96Mi }
  persistence:
    size: 512Mi
    storageClassName: ""
