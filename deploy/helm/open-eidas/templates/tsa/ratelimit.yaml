{{- if and .Values.tsa.gateway.enabled .Values.tsa.gateway.rateLimit.enabled }}
{{- $name := printf "%s-tsa" (include "open-eidas.fullname" .) -}}
# Limite de débit par adresse source sur la route de la TSA. Spécifique à Envoy
# Gateway : la CRD doit être installée dans le cluster, sinon le rendu est refusé
# à l'application (c'est voulu : une limite demandée qui n'existerait pas en
# silence serait pire qu'une erreur).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-eidas.componentLabels" (dict "context" . "component" "tsa") | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $name }}
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: {{ .Values.tsa.gateway.rateLimit.requests }}
            unit: {{ .Values.tsa.gateway.rateLimit.unit }}
{{- end }}
