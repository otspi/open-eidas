{{- $fullname := include "open-eidas.fullname" . -}}
{{- $name := printf "%s-tsa" $fullname -}}
{{- $secretName := include "open-eidas.secretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-eidas.componentLabels" (dict "context" . "component" "tsa") | nindent 4 }}
spec:
  replicas: {{ .Values.tsa.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "open-eidas.componentSelectorLabels" (dict "context" . "component" "tsa") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "open-eidas.componentSelectorLabels" (dict "context" . "component" "tsa") | nindent 8 }}
    spec:
      # Voir le commentaire équivalent de ca/deployment.yaml : sans fsGroup,
      # un CSI qui provisionne des volumes appartenant à root (Longhorn)
      # laisse le token SoftHSM illisible en écriture pour l'utilisateur
      # non-root du conteneur (uid 10001).
      securityContext:
        fsGroup: 10001
      containers:
        - name: tsa
          image: "{{ .Values.tsa.image.repository }}:{{ .Values.tsa.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.tsa.service.port }}
          env:
            - name: OPENEIDAS_LISTEN
              value: {{ printf ":%d" (.Values.tsa.service.port | int) | quote }}
            - name: OPENEIDAS_PIN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: tsa-pin
            # PIN SO du token (constat C-2) : `optional` pour un Secret externe
            # qui ne le porte pas ; en production, le conteneur refuse alors de
            # démarrer (deploy/tsa/entrypoint.sh).
            - name: OPENEIDAS_SO_PIN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: tsa-so-pin
                  optional: true
            - name: OPENEIDAS_RSA_SCHEME
              value: {{ .Values.rsaScheme | quote }}
            {{- if .Values.production }}
            - name: OPENEIDAS_PRODUCTION
              value: "true"
            {{- end }}
            - name: OPENEIDAS_TOKEN_LABEL
              value: open-eidas-tsa
            - name: OPENEIDAS_KEY_LABEL
              value: tsu-signing-key
            - name: OPENEIDAS_KEY_BITS
              value: "3072"
            - name: OPENEIDAS_POLICY_OID
              value: {{ .Values.tsa.policyOID | quote }}
            - name: OPENEIDAS_ACCURACY
              value: "1s"
            - name: OPENEIDAS_TIME_POLICY
              value: {{ .Values.tsa.time.policy | quote }}
            - name: OPENEIDAS_TIME_SOURCES
              value: {{ .Values.tsa.time.sources | quote }}
            - name: OPENEIDAS_TIME_MIN_SOURCES
              value: {{ .Values.tsa.time.minSources | quote }}
            - name: OPENEIDAS_TIME_MAX_OFFSET
              value: {{ .Values.tsa.time.maxOffset | quote }}
            - name: OPENEIDAS_AUDIT_FILE
              value: /var/lib/open-eidas/state/audit.log
            - name: OPENEIDAS_AUDIT_SEAL_INTERVAL
              value: {{ .Values.tsa.audit.sealInterval | quote }}
            - name: OPENEIDAS_CROSS_TSA_URLS
              value: {{ .Values.tsa.crossTSA.urls | quote }}
            {{- /* Copie hors site du journal, déposée à chaque scellement
                   (constat J-1). Sans point d'accès, le journal reste local. */}}
            {{- if .Values.tsa.audit.s3.endpoint }}
            {{- $s3Secret := required "tsa.audit.s3.existingSecret est obligatoire dès que tsa.audit.s3.endpoint est renseigné" .Values.tsa.audit.s3.existingSecret }}
            - name: OPENEIDAS_S3_ENDPOINT
              value: {{ .Values.tsa.audit.s3.endpoint | quote }}
            - name: OPENEIDAS_S3_BUCKET
              value: {{ required "tsa.audit.s3.bucket est obligatoire dès que tsa.audit.s3.endpoint est renseigné" .Values.tsa.audit.s3.bucket | quote }}
            - name: OPENEIDAS_S3_REGION
              value: {{ .Values.tsa.audit.s3.region | quote }}
            - name: OPENEIDAS_S3_KEY
              value: {{ .Values.tsa.audit.s3.key | quote }}
            - name: OPENEIDAS_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $s3Secret }}
                  key: access-key
            - name: OPENEIDAS_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $s3Secret }}
                  key: secret-key
            {{- end }}
            - name: OPENEIDAS_CERT_FILE
              value: /var/lib/open-eidas/state/tsu.pem
            - name: OPENEIDAS_CHAIN_FILE
              value: /var/lib/open-eidas/state/chain.pem
            - name: OPENEIDAS_ENROLL_ENDPOINT
              value: {{ printf "%s/api/v1/enroll" (include "open-eidas.caInternalURL" .) | quote }}
            - name: OPENEIDAS_ENROLL_PROFILE
              value: tsa_signer
            - name: OPENEIDAS_ENROLL_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: enroll-hmac-key
            # Seul le nom courant est demandé : unité, organisation et pays
            # sont imposés par le profil côté autorité.
            - name: OPENEIDAS_SUBJECT_CN
              value: {{ .Values.tsa.subject.commonName | quote }}
            {{- if .Values.tsa.corsAllowedOrigin }}
            - name: OPENEIDAS_CORS_ALLOWED_ORIGIN
              value: {{ .Values.tsa.corsAllowedOrigin | quote }}
            {{- end }}
          volumeMounts:
            - name: softhsm
              mountPath: /var/lib/softhsm/tokens
            - name: state
              mountPath: /var/lib/open-eidas/state
          # Le serveur HTTP ne démarre qu'une fois l'enrôlement auprès de la
          # CA réussi (jusqu'à 60 tentatives à 10 s d'intervalle,
          # voir deploy/tsa/entrypoint.sh) : sans startupProbe, la
          # livenessProbe tuerait le conteneur avant même que /healthz
          # existe, pendant cette attente pourtant normale.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.tsa.resources | nindent 12 }}
      volumes:
        - name: softhsm
          persistentVolumeClaim:
            claimName: {{ $name }}-softhsm
        - name: state
          persistentVolumeClaim:
            claimName: {{ $name }}-state
