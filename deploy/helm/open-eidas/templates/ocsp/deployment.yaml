{{- $fullname := include "open-eidas.fullname" . -}}
{{- $name := printf "%s-ocsp" $fullname -}}
{{- $secretName := include "open-eidas.secretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-eidas.componentLabels" (dict "context" . "component" "ocsp") | nindent 4 }}
spec:
  replicas: {{ .Values.ocsp.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "open-eidas.componentSelectorLabels" (dict "context" . "component" "ocsp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "open-eidas.componentSelectorLabels" (dict "context" . "component" "ocsp") | nindent 8 }}
    spec:
      # Voir le commentaire équivalent de ca/deployment.yaml : sans fsGroup,
      # un CSI qui provisionne des volumes appartenant à root (Longhorn)
      # laisse le token SoftHSM illisible en écriture pour l'utilisateur
      # non-root du conteneur (uid 10002).
      securityContext:
        fsGroup: 10002
      containers:
        - name: ocsp
          image: "{{ .Values.ocsp.image.repository }}:{{ .Values.ocsp.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ocsp.service.port }}
          env:
            - name: OPENEIDAS_LISTEN
              value: {{ printf ":%d" (.Values.ocsp.service.port | int) | quote }}
            - name: OPENEIDAS_PIN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: ocsp-pin
            - name: OPENEIDAS_SO_PIN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: ocsp-so-pin
                  optional: true
            - name: OPENEIDAS_RSA_SCHEME
              value: {{ .Values.rsaScheme | quote }}
            {{- if .Values.production }}
            - name: OPENEIDAS_PRODUCTION
              value: "true"
            {{- end }}
            - name: OPENEIDAS_TOKEN_LABEL
              value: open-eidas-ocsp
            - name: OPENEIDAS_KEY_LABEL
              value: ocsp-signing-key
            - name: OPENEIDAS_KEY_BITS
              value: "3072"
            - name: OPENEIDAS_CERT_FILE
              value: /var/lib/open-eidas/state/ocsp.pem
            - name: OPENEIDAS_CHAIN_FILE
              value: /var/lib/open-eidas/state/chain.pem
            - name: OPENEIDAS_SUBJECT_CN
              value: {{ .Values.ocsp.subject.commonName | quote }}
            - name: OPENEIDAS_ENROLL_ENDPOINT
              value: {{ printf "%s/api/v1/enroll" (include "open-eidas.caInternalURL" .) | quote }}
            - name: OPENEIDAS_ENROLL_PROFILE
              value: ocsp_responder
            - name: OPENEIDAS_ENROLL_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.ocsp.enrollSecret.name }}
                  name: {{ .Values.ocsp.enrollSecret.name }}
                  key: {{ .Values.ocsp.enrollSecret.key }}
                  {{- else }}
                  name: {{ $secretName }}
                  key: enroll-hmac-key
                  {{- end }}
            # Adresse à laquelle CE SERVICE joint la CA pour interroger sa
            # CRL — interne au cluster, à ne pas confondre avec
            # open-eidas.pkiPublicURL (adresse externe gravée dans les
            # certificats).
            - name: OPENEIDAS_PKI_INTERNAL_URL
              value: {{ include "open-eidas.caInternalURL" . | quote }}
          volumeMounts:
            - name: softhsm
              mountPath: /var/lib/softhsm/tokens
            - name: state
              mountPath: /var/lib/open-eidas/state
          # Comme pour la TSA : la demande d'enrôlement attend l'approbation
          # d'un opérateur RA, ce qui peut prendre un temps arbitraire (voir
          # tsa/deployment.yaml) avant que /healthz existe.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.ocsp.resources | nindent 12 }}
      volumes:
        - name: softhsm
          persistentVolumeClaim:
            claimName: {{ $name }}-softhsm
        - name: state
          persistentVolumeClaim:
            claimName: {{ $name }}-state
