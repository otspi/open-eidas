{{- if .Values.raConsole.enabled -}}
{{- $fullname := include "open-eidas.fullname" . -}}
{{- $name := printf "%s-ra-console-grants" $fullname -}}
{{- $secretName := include "open-eidas.secretName" . -}}
# Droits du rôle PostgreSQL en lecture seule de ra-console. Le script est une
# copie de crates/oe-castore/sql/ra_console_grants.sql (la CI vérifie que les
# deux sont identiques) : Helm ne lit pas de fichier hors du chart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-eidas.componentLabels" (dict "context" . "component" "ra-console") | nindent 4 }}
data:
  ra_console_grants.sql: |
    {{- .Files.Get "files/ra_console_grants.sql" | nindent 4 }}
---
# Appliqué par un Job à chaque installation ET mise à jour (idempotent) : un
# nouveau droit (ex. SELECT sur `actions`) arrive ainsi sans geste manuel. Un
# Job plutôt qu'un initContainer de la console : les identifiants
# d'administration de la base n'entrent jamais dans le pod le plus exposé
# (docs/WEBUI.md §16). Il attend que ca-server ait appliqué ses migrations
# (les tables à autoriser doivent exister).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-eidas.componentLabels" (dict "context" . "component" "ra-console") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: {{ .Values.raConsole.grantsJob.timeoutSeconds }}
  template:
    metadata:
      labels:
        {{- include "open-eidas.componentSelectorLabels" (dict "context" . "component" "ra-console-grants") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: grants
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until psql -tAc "SELECT to_regclass('public.sessions') IS NOT NULL AND to_regclass('public.actions') IS NOT NULL" 2>/dev/null | grep -q t; do
                echo "migrations de ca-server pas encore appliquées, nouvel essai dans 5 s"
                sleep 5
              done
              psql -v ON_ERROR_STOP=1 -f /sql/ra_console_grants.sql
              # Mot de passe par variable psql, jamais dans la ligne de commande.
              echo "ALTER ROLE openeidas_ra_console LOGIN PASSWORD :'pw';" \
                | psql -v ON_ERROR_STOP=1 -v pw="$RA_DB_PASSWORD"
              echo "droits de openeidas_ra_console appliqués"
          env:
            - name: PGHOST
              value: {{ include "open-eidas.postgresHost" . | quote }}
            - name: PGPORT
              value: {{ include "open-eidas.postgresPort" . | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: postgres-password
            - name: RA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: ra-console-db-password
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: {{ $name }}
{{- end }}
