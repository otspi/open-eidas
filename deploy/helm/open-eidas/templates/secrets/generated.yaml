{{- /*
Secret des valeurs sensibles générées automatiquement. Le motif `lookup`
ci-dessous les rend stables d'un `helm upgrade` à l'autre : une fois émis, le
mot de passe PostgreSQL ou le PIN d'un token PKCS#11 ne doit plus changer,
sous peine de rendre inaccessibles les données déjà écrites — et, pour les
tokens de la CA, de rendre la hiérarchie entière inexploitable.

Une valeur explicitement fournie dans les values prime toujours sur celle,
existante ou générée, du Secret. `lookup` renvoie un dictionnaire vide (donc
faux dans un `if`) lorsque le Secret n'existe pas encore.

Ne s'applique que si secrets.existingSecret est vide : dans le cas contraire
(secret scellé via kubeseal et committé dans un dépôt de déploiement,
typiquement pour le staging), ce Secret ne doit pas exister du tout — voir
open-eidas.secretName dans _helpers.tpl.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $secretName := include "open-eidas.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}

{{- $postgresPassword := randAlphaNum 32 | b64enc -}}
{{- $tsaPin := randNumeric 8 | b64enc -}}
{{- $ocspPin := randNumeric 8 | b64enc -}}
{{- $caRootPin := randNumeric 8 | b64enc -}}
{{- $caIssuingPin := randNumeric 8 | b64enc -}}
{{- $webdavPassword := randAlphaNum 24 | b64enc -}}
{{- $enrollHMACKey := randAlphaNum 48 | b64enc -}}
{{- $raConsoleDbPassword := randAlphaNum 32 | b64enc -}}
{{- $raConsoleDecoySecret := randAlphaNum 48 | b64enc -}}

{{- if $existing }}
{{- $postgresPassword = index $existing.data "postgres-password" }}
{{- $tsaPin = index $existing.data "tsa-pin" }}
{{- $ocspPin = index $existing.data "ocsp-pin" }}
{{- $caRootPin = index $existing.data "ca-root-pin" }}
{{- $caIssuingPin = index $existing.data "ca-issuing-pin" }}
{{- $webdavPassword = index $existing.data "webdav-password" }}
{{- $enrollHMACKey = index $existing.data "enroll-hmac-key" }}
{{- /* Clés ajoutées avec ra-console : un Secret créé avant elles ne les porte
       pas encore, elles sont alors générées une fois puis conservées. */ -}}
{{- if index $existing.data "ra-console-db-password" }}
{{- $raConsoleDbPassword = index $existing.data "ra-console-db-password" }}
{{- end }}
{{- if index $existing.data "ra-console-decoy-secret" }}
{{- $raConsoleDecoySecret = index $existing.data "ra-console-decoy-secret" }}
{{- end }}
{{- end }}

{{- if .Values.tsa.pin }}
{{- $tsaPin = .Values.tsa.pin | b64enc }}
{{- end }}
{{- if .Values.ocsp.pin }}
{{- $ocspPin = .Values.ocsp.pin | b64enc }}
{{- end }}
{{- if .Values.auditReplica.password }}
{{- $webdavPassword = .Values.auditReplica.password | b64enc }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "open-eidas.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ $postgresPassword }}
  tsa-pin: {{ $tsaPin }}
  ocsp-pin: {{ $ocspPin }}
  # Deux PIN distincts : la racine et la CA émettrice vivent dans deux tokens
  # séparés, et rien ne justifie qu'un accès à l'un ouvre l'autre.
  ca-root-pin: {{ $caRootPin }}
  ca-issuing-pin: {{ $caIssuingPin }}
  webdav-password: {{ $webdavPassword }}
  enroll-hmac-key: {{ $enrollHMACKey }}
  # Rôle PostgreSQL en lecture seule de ra-console, et secret de ses réponses
  # de connexion uniformes (clé factice d'un nom inconnu, docs/WEBUI.md §16).
  ra-console-db-password: {{ $raConsoleDbPassword }}
  ra-console-decoy-secret: {{ $raConsoleDecoySecret }}
{{- end }}
