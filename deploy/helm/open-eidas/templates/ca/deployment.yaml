{{- $fullname := include "open-eidas.fullname" . -}}
{{- $name := printf "%s-ca" $fullname -}}
{{- $secretName := include "open-eidas.secretName" . -}}
{{- $postgresHost := printf "%s-postgres" $fullname -}}
{{- $postgresPort := 5432 -}}
{{- if .Values.postgres.external.enabled -}}
{{- $postgresHost = .Values.postgres.external.host -}}
{{- $postgresPort = (.Values.postgres.external.port | int) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-eidas.componentLabels" (dict "context" . "component" "ca") | nindent 4 }}
spec:
  # Une seule instance : les tokens PKCS#11 et le journal d'audit chaîné sont
  # portés par des volumes ReadWriteOnce, et la clé de l'autorité n'a pas
  # vocation à être répliquée.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "open-eidas.componentSelectorLabels" (dict "context" . "component" "ca") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "open-eidas.componentSelectorLabels" (dict "context" . "component" "ca") | nindent 8 }}
    spec:
      # Le conteneur tourne en utilisateur non-root (uid 10003, voir
      # deploy/ca-server/Dockerfile) : sans fsGroup, un CSI qui provisionne
      # des volumes appartenant à root (Longhorn, contrairement au
      # local-path-provisioner de kind) laisse le token SoftHSM illisible en
      # écriture et l'initialisation échoue (CKR_DEVICE_ERROR).
      securityContext:
        fsGroup: 10003
      containers:
        - name: ca
          image: "{{ .Values.ca.image.repository }}:{{ .Values.ca.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ca.service.port }}
            {{- if .Values.ca.internal.enabled }}
            - name: internal
              containerPort: {{ .Values.ca.service.internalPort }}
            {{- end }}
          env:
            {{- include "open-eidas.caEnv" (dict "context" . "postgres" $postgresHost "port" $postgresPort "secret" $secretName) | nindent 12 }}
            {{- if .Values.ca.internal.enabled }}
            {{- include "open-eidas.caInternalEnv" . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: softhsm
              mountPath: /var/lib/softhsm/tokens
            - name: state
              mountPath: /var/lib/open-eidas/state
            {{- if .Values.ca.internal.enabled }}
            - name: webauthn-models
              mountPath: /etc/open-eidas/webauthn
              readOnly: true
            {{- end }}
          # La cérémonie de clé (génération de deux bi-clés RSA-4096 dans
          # SoftHSM) précède le premier /healthz : quelques minutes de marge.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.ca.resources | nindent 12 }}
        {{- if .Values.ca.autoApprove.enabled }}
        {{- if .Values.production }}
        {{- fail "ca.autoApprove.enabled est interdit quand production: true : un déploiement de production approuve chaque demande sous une identité nominative (ETSI EN 319 411-1 GEN-6.5.5-04, constat R-2)" }}
        {{- end }}
        # ÉCART ASSUMÉ — approbation automatique des demandes d'enrôlement.
        #
        # Le point d'approbation RA est réellement actif : aucun chemin du
        # code ne mène à l'émission sans une décision identifiée (voir
        # internal/raflow). Ce conteneur prend cette décision à la place d'un
        # opérateur humain, sous une identité technique distincte, pour que la
        # démonstration et la CI s'amorcent seules. L'écart est visible dans
        # le journal d'audit, précisément parce que cette identité y figure.
        #
        # Un déploiement destiné à la qualification pose
        # ca.autoApprove.enabled=false et approuve par
        # `kubectl exec … ca-server ra approve <tx> <opérateur>`.
        #
        # Il ne monte aucun token PKCS#11 : approuver, c'est décider, pas
        # signer — l'émission a lieu dans le conteneur ci-dessus.
        - name: ra-autoapprove
          image: "{{ .Values.ca.image.repository }}:{{ .Values.ca.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              while true; do
                ca-server ra list PENDING 2>/dev/null \
                  | awk 'NR > 1 && $1 != "(aucune" { print $1 }' \
                  | while read -r tx; do
                      [ -n "$tx" ] || continue
                      echo "approbation automatique de la demande ${tx}"
                      ca-server ra approve "$tx" "{{ .Values.ca.autoApprove.operator }}" \
                        "approbation automatique de la pile de démonstration" || true
                    done
                sleep {{ .Values.ca.autoApprove.intervalSeconds }}
              done
          env:
            {{- include "open-eidas.caEnv" (dict "context" . "postgres" $postgresHost "port" $postgresPort "secret" $secretName) | nindent 12 }}
          resources:
            {{- toYaml .Values.ca.autoApprove.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: softhsm
          persistentVolumeClaim:
            claimName: {{ $name }}-softhsm
        - name: state
          persistentVolumeClaim:
            claimName: {{ $name }}-state
        {{- if .Values.ca.internal.enabled }}
        - name: webauthn-models
          configMap:
            name: {{ $name }}-webauthn-models
        {{- end }}
